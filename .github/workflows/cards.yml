name: Generate README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@e856fc8d # v2.0.2
        with:
          card: stats
          options: username=Mark44928&show_icons=true&include_all_commits=true&count_private=true&theme=transparent&hide_border=true&bg_color=0C1F17&title_color=7BD88F&icon_color=63C9A8&text_color=C9E4CE
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8d # v2.0.2
        with:
          card: top-langs
          options: username=Mark44928&layout=donut&langs_count=8&theme=transparent&hide_border=true&bg_color=0C1F17&title_color=7BD88F&text_color=C9E4CE
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@51cfb887 # v1.7.0
        with:
          options: user=Mark44928&theme=transparent&hide_border=true&background=0C1F17&ring=7BD88F&fire=63C9A8&currStreakLabel=7BD88F&sideLabels=C9E4CE&dates=78997F
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trophy card
        uses: Erik-Donath/github-profile-trophy@e3c89df9 # master
        with:
          username: Mark44928
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push